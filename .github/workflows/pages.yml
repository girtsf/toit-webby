name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Jaguar* and the trace decoder
        run: tools/build-snapshots.sh
      - name: Fetch assets
        run: tools/fetch-assets.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Content-hash URLs
        run: node tools/stamp-urls.mjs web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
