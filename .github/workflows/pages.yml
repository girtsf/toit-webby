name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Jaguar*, the trace decoder and the flasher
        run: tools/build-snapshots.sh
      - name: Fetch assets
        run: tools/fetch-assets.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Content-hash URLs
        run: node tools/stamp-urls.mjs web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Exercises the live site in headless Chrome (selftest, app load, flash-image
  # build, content-hashed URLs); no hardware.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
        working-directory: tools
      - run: node smoketest.mjs "${{ needs.deploy.outputs.page_url }}" --versioned
        working-directory: tools
