name: Build wasm release

# Run manually. By default it only builds and compares the result with the
# WASM_TAG release; with `publish`, it uploads it as WASM_TAG (bump WASM_TAG in
# versions.env first, or it replaces the existing asset).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the build as the WASM_TAG release asset
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Load versions
        run: cat versions.env | grep -v '^#' >> "$GITHUB_ENV"
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ env.EMSDK_VERSION }}
      - name: Build
        run: tools/build-wasm.sh
      - uses: actions/upload-artifact@v7
        with:
          name: toit-wasm
          path: build/toit-wasm.tar.gz
      # toit.wasm embeds absolute source paths (debug info of its bundled tool
      # snapshot), so it only matches a release built at the same path.
      - name: Compare with the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/ours build/release
          tar xzf build/toit-wasm.tar.gz -C build/ours
          if gh release download "$WASM_TAG" -p toit-wasm.tar.gz -O - | tar xz -C build/release; then
            (cd build/ours && sha256sum *) > build/ours.sha256
            (cd build/release && sha256sum -c ../ours.sha256) || echo "::warning::differs from release $WASM_TAG"
          else
            echo "no release $WASM_TAG yet"
          fi
      - name: Publish release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$WASM_TAG" >/dev/null 2>&1; then
            gh release upload "$WASM_TAG" build/toit-wasm.tar.gz --clobber
          else
            gh release create "$WASM_TAG" build/toit-wasm.tar.gz --latest=false \
              --title "$WASM_TAG" --notes "Toit $TOIT_VERSION compiler + VM built for wasm."
          fi
